# Veil — one-command offline reproduction.  §9
#
#   docker compose up
#
# Two services:
#   vllm  — the open-weights VLM, configured for THIS workload
#   veil  — the thin FastAPI layer that constrains and streams its output
#
# The extension is NOT containerised; load it unpacked from extension/.output.

name: veil

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: veil-vllm
    # --- the three flags that matter, and why (§8.2) ---
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}"
      # The redaction preamble is byte-identical every turn, so the KV-cache
      # prefix hit is free. Native for multimodal in V1.
      - "--enable-prefix-caching"
      # Token-level JSON-schema enforcement. No parse retries, no invalid-action
      # fallback path. Near-zero overhead in JSON generation.
      - "--guided-decoding-backend=xgrammar"
      # Plans are tiny and repetitive (click -> wait_for -> fill), so n-gram
      # drafts are almost free.
      - '--speculative-config={"method":"ngram","num_speculative_tokens":5,"prompt_lookup_max":4}'
      - "--max-model-len=16384"
      - "--gpu-memory-utilization=0.90"
      - "--port=8001"
    ports:
      - "8001:8001"
    volumes:
      - ${HF_HOME:-./.hf-cache}:/.cache/huggingface
    # Uncomment on a host without a GPU to get a CPU-only engine. Slow, but it
    # proves the pipeline end to end without hardware.
    # profiles: ["cpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  veil:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: veil-server
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      VLLM_BASE_URL: http://vllm:8001
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      # Was "*", which let ANY web page the user visited POST to this server
      # and receive an action plan. The server now refuses to start on a
      # wildcard, so this must be a real origin list.
      #
      # For a locally-loaded unpacked extension, put its id here — it is stable
      # across restarts, visible in chrome://extensions, and looks like
      # `chrome-extension://<32 chars>`. For a demo where the id is not yet
      # known, `dev` allows any extension origin and still excludes every
      # http/https page.
      VEIL_ALLOWED_ORIGINS: ${VEIL_ALLOWED_ORIGINS:-dev}
      # ---- planner selection -------------------------------------------
      #
      # Any OpenAI-compatible vision endpoint works. Set the key and base URL
      # in a .env file next to docker-compose.yml; the key is never committed
      # and never logged.
      #
      # VEIL_LLM_PROVIDER: auto (default, prefer the local vLLM when it is up)
      #   | local (force vLLM — nothing leaves the machine)
      #   | openai (force the API endpoint)
      VEIL_LLM_PROVIDER: ${VEIL_LLM_PROVIDER:-auto}
      VEIL_LLM_API_KEY: ${VEIL_LLM_API_KEY:-}
      VEIL_LLM_BASE_URL: ${VEIL_LLM_BASE_URL:-}
      VEIL_LLM_MODEL: ${VEIL_LLM_MODEL:-}
      # strict = token-level json_schema (best). Use `json` for an endpoint
      # that rejects the strict key; it downgrades the declared guarantee and
      # the client is told.
      VEIL_LLM_MODE: ${VEIL_LLM_MODE:-strict}
      # Declared by YOU, never inferred: only the account owner knows whether
      # their tier excludes training. Some free tiers explicitly do not.
      VEIL_LLM_ZDR: ${VEIL_LLM_ZDR:-false}
      # USD per 1M tokens, for cost accounting. Unset means UNKNOWN, which is
      # reported as unknown rather than as zero.
      VEIL_LLM_PRICING_IN: ${VEIL_LLM_PRICING_IN:-}
      VEIL_LLM_PRICING_OUT: ${VEIL_LLM_PRICING_OUT:-}
      # ---- behaviour -----------------------------------------------------
      VEIL_CONFIDENCE_FLOOR: ${VEIL_CONFIDENCE_FLOOR:-0.55}
      # exact | bucketed | noise — how much the manifest reveals about HOW MANY
      # items of each class were hidden. See server/manifest_privacy.py.
      VEIL_MANIFEST_PRIVACY: ${VEIL_MANIFEST_PRIVACY:-exact}
      VEIL_MANIFEST_EPSILON: ${VEIL_MANIFEST_EPSILON:-1.0}
    # A key present only in the environment, never baked into the image.
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped
