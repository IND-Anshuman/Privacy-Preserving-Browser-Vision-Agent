# Veil — one-command offline reproduction.  §9
#
#   docker compose up
#
# Two services:
#   vllm  — the open-weights VLM, configured for THIS workload
#   veil  — the thin FastAPI layer that constrains and streams its output
#
# The extension is NOT containerised; load it unpacked from extension/.output.

name: veil

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: veil-vllm
    # --- the three flags that matter, and why (§8.2) ---
    command:
      - "--model=${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}"
      # The redaction preamble is byte-identical every turn, so the KV-cache
      # prefix hit is free. Native for multimodal in V1.
      - "--enable-prefix-caching"
      # Token-level JSON-schema enforcement. No parse retries, no invalid-action
      # fallback path. Near-zero overhead in JSON generation.
      - "--guided-decoding-backend=xgrammar"
      # Plans are tiny and repetitive (click -> wait_for -> fill), so n-gram
      # drafts are almost free.
      - '--speculative-config={"method":"ngram","num_speculative_tokens":5,"prompt_lookup_max":4}'
      - "--max-model-len=16384"
      - "--gpu-memory-utilization=0.90"
      - "--port=8001"
    ports:
      - "8001:8001"
    volumes:
      - ${HF_HOME:-./.hf-cache}:/.cache/huggingface
    # Uncomment on a host without a GPU to get a CPU-only engine. Slow, but it
    # proves the pipeline end to end without hardware.
    # profiles: ["cpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  veil:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: veil-server
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      VLLM_BASE_URL: http://vllm:8001
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      VEIL_ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    restart: unless-stopped
