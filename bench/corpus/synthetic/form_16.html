<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarship Application — case 16</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#111827}
header{background:#1e3a8a;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #3b82f6}
.actions{display:flex;gap:10px;margin-top:16px}
button{padding:10px 18px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#fff;color:#1e3a8a}
.hint{color:#6b7280;font-size:12px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;font-size:13px}
canvas{border:1px solid #cbd5e1;border-radius:6px;max-width:100%}
img{border-radius:6px}
</style>
</head>
<body>
<header><h1>Scholarship Application — case 16</h1></header>
<main>
  <section class="card" id="identity_block">
    <h2>Applicant details</h2>
        <label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" value="Arjun Iyer">
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="arjun.iyer@example.co.in">
    <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="9861128973">
    <label for="dob">Date of birth</label><input id="dob" name="dob" type="text" autocomplete="bday" value="07/09/1987">
    <p id="summary_para">Applicant: Arjun Iyer. Contact arjun.iyer@example.co.in or +91 98611 28973. Permanent address: 296, Linking Road, Chennai 600002.</p>
    <label for="student_id">Student ID</label><input id="student_id" name="studentId" type="text" value="STU84527">
    <label for="guardian_phone">Guardian phone</label><input id="guardian_phone" name="guardian_phone" type="tel" value="8486787161">
    <label for="income_proof">Annual family income</label><input id="income_proof" name="income_proof" type="text" value="₹4,00,000">
    <label for="institution">Institution</label><input id="institution" name="institution" type="text" value="Institute of Technology, Chennai">
    <button type="submit" id="submit_btn" name="submit_btn">Submit application</button>
    <button type="button" id="cancel_btn" class="secondary">Cancel</button>
    <label for="notes">Notes</label><textarea id="notes" name="notes" rows="3"></textarea>
  </section>
  <div id="profile_widget" data-user-email="hidden.user@corp.io" data-pii="true"
     data-telemetry="anon">Widget</div>
  <section class="card">
    <h2>Review</h2>
    <table id="summary_table">
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Name</td><td>Arjun Iyer</td></tr>
      <tr><td>Reference</td><td>VEIL-0016</td></tr>
    </table>
  </section>
  <div class="actions"><button type="submit" id="submit_btn">Submit application</button><button type="button" id="cancel_btn" class="secondary">Cancel</button></div>
</main>
</body>
</html>
