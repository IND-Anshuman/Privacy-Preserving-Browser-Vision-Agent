<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Railway Passenger Registration — case 17</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#111827}
header{background:#1e3a8a;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #3b82f6}
.actions{display:flex;gap:10px;margin-top:16px}
button{padding:10px 18px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#fff;color:#1e3a8a}
.hint{color:#6b7280;font-size:12px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;font-size:13px}
canvas{border:1px solid #cbd5e1;border-radius:6px;max-width:100%}
img{border-radius:6px}
</style>
</head>
<body>
<header><h1>Railway Passenger Registration — case 17</h1></header>
<main>
  <section class="card" id="identity_block">
    <h2>Applicant details</h2>
        <label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" value="Sneha Pillai">
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="sneha.pillai@mailbox.net">
    <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="9922564396">
    <label for="dob">Date of birth</label><input id="dob" name="dob" type="text" autocomplete="bday" value="11/05/1989">
    <p id="summary_para">Applicant: Sneha Pillai. Contact sneha.pillai@mailbox.net or +91 99225 64396. Permanent address: 195, Gariahat Road, Bengaluru 560001.</p>
    <label for="passenger_name">Passenger name</label><input id="passenger_name" name="passenger_name" type="text" autocomplete="name" value="Sneha Pillai">
    <label for="passport">Passport number</label><input id="passport" name="passportNumber" type="text" value="B3387837">
    <label for="dl">Driving licence</label><input id="dl" name="dlNumber" type="text" value="KA053241152086">
    <label for="emergency_phone">Emergency contact number</label><input id="emergency_phone" name="emergency_phone" type="tel" value="7336234019">
    <button type="submit" id="submit_btn" name="submit_btn">Submit application</button>
    <button type="button" id="cancel_btn" class="secondary">Cancel</button>
    <label for="notes">Notes</label><textarea id="notes" name="notes" rows="3"></textarea>
  </section>
  <div id="closed_host"></div>
<script>
  (function(){
    const host = document.getElementById('closed_host');
    const root = host.attachShadow({ mode: 'closed' });  // deliberately closed
    root.innerHTML = '<div>Registered mobile: <b>8903453832</b></div>';
  })();
</script>
  <section class="card">
    <h2>Review</h2>
    <table id="summary_table">
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Name</td><td>Sneha Pillai</td></tr>
      <tr><td>Reference</td><td>VEIL-0017</td></tr>
    </table>
  </section>
  <div class="actions"><button type="submit" id="submit_btn">Submit application</button><button type="button" id="cancel_btn" class="secondary">Cancel</button></div>
</main>
</body>
</html>
