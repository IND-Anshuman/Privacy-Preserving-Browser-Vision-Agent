<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings Account Opening — case 00</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#111827}
header{background:#1e3a8a;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #3b82f6}
.actions{display:flex;gap:10px;margin-top:16px}
button{padding:10px 18px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#fff;color:#1e3a8a}
.hint{color:#6b7280;font-size:12px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;font-size:13px}
canvas{border:1px solid #cbd5e1;border-radius:6px;max-width:100%}
img{border-radius:6px}
</style>
</head>
<body>
<header><h1>Savings Account Opening — case 00</h1></header>
<main>
  <section class="card" id="identity_block">
    <h2>Applicant details</h2>
        <label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" value="Divya Banerjee">
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="divya.banerjee@mailbox.net">
    <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="6117651412">
    <label for="dob">Date of birth</label><input id="dob" name="dob" type="text" autocomplete="bday" value="05/09/1959">
    <p id="summary_para">Applicant: Divya Banerjee. Contact divya.banerjee@mailbox.net or +91 61176 51412. Permanent address: 150, Anna Salai, Delhi 110001.</p>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" value="iw0IW49ONmOa4G">
    <label for="aadhaar">Aadhaar number</label><input id="aadhaar" name="aadhaarNumber" type="text" value="834287209634">
    <label for="pan">PAN</label><input id="pan" name="pan" type="text" value="QRFCU3629K">
    <label for="card_number">Card number</label><input id="card_number" name="card_number" type="text" autocomplete="cc-number" value="4539427795899860">
    <label for="card_cvv">CVV</label><input id="card_cvv" name="card_cvv" type="text" autocomplete="cc-csc" value="286">
    <label for="ifsc">IFSC code</label><input id="ifsc" name="ifscCode" type="text" value="UTIB0449585">
    <label for="account_no">Account number</label><input id="account_no" name="accountNumber" type="text" value="179749254356">
    <button type="submit" id="submit_btn" name="submit_btn">Submit application</button>
    <button type="button" id="cancel_btn" class="secondary">Cancel</button>
    <label for="notes">Notes</label><textarea id="notes" name="notes" rows="3"></textarea>
  </section>
  <section class="card">
  <h3>Recent activity (rendered by the widget)</h3>
  <canvas id="activity_canvas" width="520" height="160"
    data-widget="activity-summary"></canvas>
  <script>
    // Text drawn into the canvas — invisible to every DOM rule (ARCHITECTURE §5).
    (function(){
      const c = document.getElementById('activity_canvas');
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = '#111'; g.font = '16px monospace';
      const lines = "Arjun Khan\ncanvas.user@example.co.in\n8190384339".split("\\n");
      lines.forEach((t, i) => g.fillText(t, 16, 36 + i * 26));
    })();
  </script>
</section>
  <section class="card">
    <h2>Review</h2>
    <table id="summary_table">
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Name</td><td>Divya Banerjee</td></tr>
      <tr><td>Reference</td><td>VEIL-0000</td></tr>
    </table>
  </section>
  <div class="actions"><button type="submit" id="submit_btn">Submit application</button><button type="button" id="cancel_btn" class="secondary">Cancel</button></div>
</main>
</body>
</html>
