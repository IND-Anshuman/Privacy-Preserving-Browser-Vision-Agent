<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Registration — case 04</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;color:#111827}
header{background:#1e3a8a;color:#fff;padding:18px 24px}
header h1{margin:0;font-size:19px}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #3b82f6}
.actions{display:flex;gap:10px;margin-top:16px}
button{padding:10px 18px;border-radius:6px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#fff;color:#1e3a8a}
.hint{color:#6b7280;font-size:12px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;font-size:13px}
canvas{border:1px solid #cbd5e1;border-radius:6px;max-width:100%}
img{border-radius:6px}
</style>
</head>
<body>
<header><h1>Patient Registration — case 04</h1></header>
<main>
  <section class="card" id="identity_block">
    <h2>Applicant details</h2>
        <label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" autocomplete="name" value="Karan Rao">
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" value="karan.rao@acme.in">
    <label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" value="8704664643">
    <label for="dob">Date of birth</label><input id="dob" name="dob" type="text" autocomplete="bday" value="10/07/1984">
    <p id="summary_para">Applicant: Karan Rao. Contact karan.rao@acme.in or +91 87046 64643. Permanent address: 171, Sector 18, Pune 411001.</p>
    <label for="patient_id">Patient ID</label><input id="patient_id" name="patientId" type="text" value="PT338927">
    <label for="diagnosis">Diagnosis</label><input id="diagnosis" name="diagnosis" type="text" value="Hypertension">
    <label for="emergency_contact">Emergency contact</label><input id="emergency_contact" name="emergency_contact" type="text" value="Sneha Sharma +91 8568854775">
    <label for="aadhaar">Aadhaar for insurance</label><input id="aadhaar" name="aadhaarNumber" type="text" value="825252470062">
    <button type="submit" id="submit_btn" name="submit_btn">Submit application</button>
    <button type="button" id="cancel_btn" class="secondary">Cancel</button>
    <label for="notes">Notes</label><textarea id="notes" name="notes" rows="3"></textarea>
  </section>
  <section class="card">
  <h3>Selfie verification</h3>
  <img id="selfie" alt="passport photo" width="180" height="220"
       src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='220'%3E%3Crect width='180' height='220' fill='%23c9d6e3'/%3E%3Ccircle cx='90' cy='80' r='42' fill='%23f2c9a0'/%3E%3Cellipse cx='90' cy='190' rx='70' ry='50' fill='%23f2c9a0'/%3E%3C/svg%3E">
  <label><input type="checkbox" id="face_match"> Face matches my Aadhaar photo</label>
</section>
  <section class="card">
    <h2>Review</h2>
    <table id="summary_table">
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Name</td><td>Karan Rao</td></tr>
      <tr><td>Reference</td><td>VEIL-0004</td></tr>
    </table>
  </section>
  <div class="actions"><button type="submit" id="submit_btn">Submit application</button><button type="button" id="cancel_btn" class="secondary">Cancel</button></div>
</main>
</body>
</html>
