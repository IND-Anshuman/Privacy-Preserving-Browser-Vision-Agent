<!doctype html>
<html><head><meta charset="utf-8"><title>L3 canvas coverage</title>
<style>
 body { font: 14px ui-monospace, monospace; background:#0b1120; color:#e2e8f0; padding:24px }
 h1 { font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:#94a3b8 }
 pre { background:#111827; border:1px solid #1f2937; padding:16px; border-radius:8px; overflow:auto }
 .ok { color:#34d399 } .bad { color:#f87171 } .dim { color:#64748b }
 canvas { border:1px dashed #334155; margin:4px; }
</style></head>
<body>
<h1>L3 canvas coverage &mdash; measured in this browser</h1>
<pre id="out">running&hellip;</pre>
<div id="canvases"></div>
<script>



async function runL3Text(
  source) {
  const t0 = performance.now()
  try {
    const w = 'width' in source ? source.width : 0
    const h = 'height' in source ? source.height : 0
    if (w < 8 || h < 8) return { boxes: [], ms: performance.now() - t0, available: false }

    // Downscale for the analysis pass. Text density is a statistical property
    // and survives 1/4 scale; the cost does not.
    const sw = Math.max(1, Math.round(w / 4))
    const sh = Math.max(1, Math.round(h / 4))
    const small = new OffscreenCanvas(sw, sh)
    const sctx = small.getContext('2d', { willReadFrequently: true })
    if (!sctx) return { boxes: [], ms: performance.now() - t0, available: false }
    sctx.drawImage(source , 0, 0, sw, sh)
    const img = sctx.getImageData(0, 0, sw, sh)

    const boxes= []
    // 8x8 analysis cells: big enough to hold a word, small enough to localise.
    const CELL = 8
    const cols = Math.floor(sw / CELL)
    const rows = Math.floor(sh / CELL)
    if (cols < 1 || rows < 1) return { boxes: [], ms: performance.now() - t0, available: false }

    // Canny-ish edge energy per cell. Text has many short high-contrast
    // strokes; a photo or a solid fill has few. This is a heuristic and is
    // labelled  — it does not know what a letter is.
    const energy = new Float32Array(cols * rows)
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        let e = 0
        let n = 0
        for (let y = cy * CELL; y < (cy + 1) * CELL; y++) {
          for (let x = cx * CELL; x < (cx + 1) * CELL; x++) {
            const i = (y * sw + x) * 4
            const g = 0.299 * img.data[i] + 0.587 * img.data[i + 1] + 0.114 * img.data[i + 2]
            if (x + 1 < sw) {
              const g2 =
                0.299 * img.data[i + 4] + 0.587 * img.data[i + 5] + 0.114 * img.data[i + 6]
              e += Math.abs(g - g2)
              n++
            }
            if (y + 1 < sh) {
              const d = ((y + 1) * sw + x) * 4
              const g3 =
                0.299 * img.data[d] + 0.587 * img.data[d + 1] + 0.114 * img.data[d + 2]
              e += Math.abs(g - g3)
              n++
            }
          }
        }
        energy[cy * cols + cx] = n > 0 ? e / n : 0
      }
    }

    // Threshold at a fraction of the frame's own busiest cell, so it adapts to
    // a high-contrast page and a low-contrast one alike. A fixed threshold is
    // either silent on clean pages or saturated on busy ones.
    let peak = 0
    for (const v of energy) if (v > peak) peak = v
    if (peak < 6) return { boxes: [], ms: performance.now() - t0, available: true }
    const cut = peak * 0.35

    // Group contiguous text-dense cells into line-shaped rectangles.
    const seen = new Uint8Array(cols * rows)
    const groups= []
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const idx = cy * cols + cx
        if (seen[idx] || energy[idx] < cut) continue
        // Flood fill over dense neighbours.
        const stack = [idx]
        seen[idx] = 1
        let x0 = cx, y0 = cy, x1 = cx, y1 = cy, n = 0
        while (stack.length) {
          const cur = stack.pop()
          const qx = cur % cols
          const qy = Math.floor(cur / cols)
          n++
          if (qx < x0) x0 = qx
          if (qx > x1) x1 = qx
          if (qy < y0) y0 = qy
          if (qy > y1) y1 = qy
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]] ) {
            const nx = qx + dx
            const ny = qy + dy
            if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue
            const ni = ny * cols + nx
            if (seen[ni] || energy[ni] < cut) continue
            seen[ni] = 1
            stack.push(ni)
          }
        }
        // A group of 2+ cells is a line of text; a lone cell is noise.
        if (n >= 2) groups.push({ x0, y0, x1, y1, n })
      }
    }

    for (const g of groups) {
      // Back to full-resolution pixels, with a one-cell margin so ascenders and
      // descenders are not clipped by the analysis grid.
      const pad = CELL
      const x = Math.max(0, (g.x0 * CELL - pad) * 4)
      const y = Math.max(0, (g.y0 * CELL - pad) * 4)
      const bw = Math.min(w - x, (g.x1 - g.x0 + 1) * CELL * 4 + pad * 8)
      const bh = Math.min(h - y, (g.y1 - g.y0 + 1) * CELL * 4 + pad * 8)
      if (bw < 12 || bh < 6) continue
      boxes.push({
        box: { x, y, w: bw, h: bh },
        // Confidence is the cell's share of the frame peak, not a probability.
        // Overstating it would let a threshold sweep claim more than it has.
        score: Math.min(0.95, 0.4 + (g.n / (cols * rows)) * 4),
        // Neutral marker, NOT a PII class. The OCR stage re-runs L1/L2 on the
        // recovered string and THAT decides the class. Labelling every text
        // region DATE ( earlier version did) is how a detector learns to
        // output a class it has no evidence for.
        cls: 'DATE' ,
      })
    }

    return { boxes, ms: performance.now() - t0, available: true }
  } catch (err) {
    /**
     * A bare `catch` here was itself a bug. It reported `available: false`,
     * which the caller cannot distinguish from "the detector ran and found
     * nothing" or "the model is missing" — so a crash in this function was
     * indistinguishable from a clean page, and the canvas gap stayed 0/16 with
     * no signal. The error is reported so a failure is visible rather than
     * silently folded into a zero.
     */
    console.error('[veil] L3 text detection failed', err)
    return {
      boxes: [],
      ms: performance.now() - t0,
      available: false,
      error: String(err instanceof Error ? err.message : err),
    }
  }
}


/* Mirrors bench/measure_l3_canvas.ts, minus the port. */
const CASES = [{"id": "syn_00", "pii": [{"cls": "PERSON", "value": "Arjun Khan"}, {"cls": "EMAIL", "value": "canvas.user@example.co.in"}, {"cls": "PHONE", "value": "8190384339"}]}, {"id": "syn_05", "pii": [{"cls": "PERSON", "value": "Priya Patel"}, {"cls": "EMAIL", "value": "canvas.user@acme.in"}, {"cls": "PHONE", "value": "8884471283"}]}, {"id": "syn_10", "pii": [{"cls": "PERSON", "value": "Ankit Nair"}, {"cls": "EMAIL", "value": "canvas.user@corp.io"}, {"cls": "PHONE", "value": "7216452622"}]}, {"id": "syn_15", "pii": [{"cls": "PERSON", "value": "Ankit Desai"}, {"cls": "EMAIL", "value": "canvas.user@mailbox.net"}, {"cls": "PHONE", "value": "6399995977"}]}];
const W = 640, H = 220, LINE = 40, TOP = 40, LEFT = 20;

function covers(boxes, x, y) {
  return boxes.some(b => x >= b.box.x && x <= b.box.x + b.box.w && y >= b.box.y && y <= b.box.y + b.box.h);
}

async function run() {
  const out = document.getElementById('out');
  const host = document.getElementById('canvases');
  let checked = 0, covered = 0, boxes = 0, ms = 0, n = 0;
  const missed = [];

  for (const c of CASES) {
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    host.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#000000'; ctx.font = '16px monospace';
    c.pii.forEach((inst, i) => ctx.fillText(inst.value, LEFT, TOP + i * LINE));

    const r = await runL3Text(canvas);
    boxes += r.boxes.length; ms += r.ms; n++;
    if (!r.available) continue;

    for (let i = 0; i < c.pii.length; i++) {
      checked++;
      if (covers(r.boxes, LEFT, TOP + i * LINE)) covered++;
      else if (missed.length < 8) missed.push(c.pii[i].cls + ' ' + JSON.stringify(c.pii[i].value.slice(0, 28)));
    }
    // Draw the regions the detector found, so a human can see whether it is
    // finding the text or something else entirely.
    ctx.strokeStyle = 'rgba(220,38,38,.85)'; ctx.lineWidth = 2;
    for (const b of r.boxes) ctx.strokeRect(b.box.x, b.box.y, b.box.w, b.box.h);
  }

  const pct = d => d === 0 ? 'n/a' : ((d / 100 * 100).toFixed(1) + '%');
  const rate = (a, b) => b === 0 ? 'n/a' : (a / b * 100).toFixed(1) + '%';
  out.textContent = [
    'L3 CANVAS COVERAGE (real canvas, real rendered text)',
    '='.repeat(66),
    `  user agent        : ${ navigator.userAgent.slice(0, 60) }`,
    `  canvases measured : ${n}`,
    `  PII lines drawn   : ${checked}`,
    `  covered by region : ${covered}  (${rate(covered, checked)})`,
    `  regions found     : ${boxes}  (avg ${(boxes / Math.max(1, n)).toFixed(1)}/canvas)`,
    `  detector cost     : ${(ms / Math.max(1, n)).toFixed(1)} ms/canvas`,
    missed.length ? '  missed:\n' + missed.map(m => '    ' + m).join('\n') : '  missed            : (none)',
    '='.repeat(66),
    'Red boxes are the detected regions. This is the DETECTOR only; end-to-end',
    'canvas safety also rests on the OPAQUE_REGION fail-closed rule.',
  ].join('\n');

  window.__RESULT__ = { checked, covered, boxes, ms: ms / Math.max(1, n), canvases: n, missed };
  document.title = 'done';
}

run().catch(e => {
  document.getElementById('out').textContent = 'FAILED: ' + e.message + '\n' + e.stack;
  window.__ERROR__ = String(e && e.stack || e);
  document.title = 'done';
});
</script>
</body></html>
